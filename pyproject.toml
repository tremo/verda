[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "verda-v2"
version = "0.4.0"
description = "Local Verda research backend with preserved history and durable workflow execution"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.142.2,<1",
  "pydantic>=2.13.5,<3",
  "sqlalchemy>=2.0.54,<2.1",
  "uvicorn>=0.54.0,<1",
  "jsonschema>=4.23,<5",
  "mcp>=2,<3",
]

[project.optional-dependencies]
jev = ["jev-ultrafast @ git+https://github.com/browser-use/jev-ultrafast.git@1231850a0bf1a0c0341fe408ef1668dbbfdfac46"]
postgres = ["psycopg[binary]>=3.3.6,<4"]
test = ["pytest>=9.1.1,<10", "httpx>=0.28.1,<1"]

[project.scripts]
verda = "verda.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
verda = ["ui/*.html", "ui/*.css", "ui/*.js", "agency/*.json", "agency/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
