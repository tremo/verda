<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verda · Soru onayı</title><link rel="stylesheet" href="/control/assets/listing.css"><script src="/control/assets/lib.js" defer></script><script src="/control/assets/asks.js" defer></script><script src="/control/assets/attention-badge.js" defer></script>
<style>
.ask{border-bottom:1px solid var(--line)}.ask:last-child{border-bottom:0}
.ask>summary{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px 14px;cursor:pointer;list-style:none}
.ask>summary::-webkit-details-marker{display:none}
.ask>summary:hover{background:var(--soft)}
.ask[data-choice=ask]>summary{border-left:3px solid var(--ok)}.ask[data-choice=hold]>summary{border-left:3px solid var(--warn)}
.amain{min-width:0}.aline{display:flex;gap:8px;flex-wrap:wrap;align-items:baseline;font-size:13px}.aline a{white-space:nowrap}
.atitle{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.asks{font-size:12px;color:var(--mut)}
.choice{display:flex;gap:4px}.choice button{padding:3px 10px;font-size:13px;border-radius:99px}
.choice button[aria-pressed=true][data-c=ask]{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.choice button[aria-pressed=true][data-c=hold]{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
.choice button[data-c=exclude]:hover{color:var(--bad)}
.detail{padding:4px 14px 14px 70px;font-size:13px}
.detail blockquote{margin:6px 0 10px;padding:8px 10px;background:var(--soft);border-radius:8px;white-space:pre-wrap}
.cases{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}.case{border:1px solid var(--line);border-radius:10px;padding:6px 10px;min-width:150px}
.case b{font-size:18px;font-variant-numeric:tabular-nums}.case .d{color:var(--mut);font-size:12px}
.up{color:var(--ok)}.down{color:var(--bad)}
@media (max-width:640px){.ask>summary{grid-template-columns:40px minmax(0,1fr)}.choice{grid-column:1/-1}.detail{padding-left:14px}}
</style></head>
<body>
<header><a class="brand" href="/control">verda</a><nav aria-label="Ana menü"><a href="/control">Agent merkezi</a><a href="/control/ranking">İlanlar</a><a href="/control/asks" aria-current="page">Soru onayı</a><a href="/control/operators">Çalışma durumu</a><a href="/control/settings">Ayarlar</a></nav><span class="local"><i></i> Bu Mac</span></header>
<main id="app" aria-live="polite"><p class="muted">Yükleniyor… (her ilanın sorusu ve puanı hesaplanıyor, biraz sürebilir)</p></main>
</body></html>
